<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>a11y simulator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<main class="extension-menu">
    <h1 class="title"> A11y Simulator</h1>
    <div class="buttons">
        <button id="orange-colour">
            Orange Colour
        </button>
        <button id="black-overlay">
            Black Overlay
        </button>
        <h3>Dyslexia</h3>
        <div class="dyslexia">
            <div class="check-option">
                <input type="checkbox" id="mirroring" name="mirroring"/>
                <label for="mirroring">Mirroring</label>
            </div>
            <div class="check-option">
                <input type="checkbox" id="spaces" name="spaces"/>
                <label for="spaces">Spaces</label>
            </div>

            <div class="check-option">
                <input type="checkbox" id="switching" name="switching"/>
                <label for="switching">Switching</label>
            </div>

            <div class="check-option">
                <input type="checkbox" id="word-order" name="word-order"/>
                <label for="word-order">Word Order</label>
            </div>
        </div>
        <section>
            <p> Visual impairment</p>

            <button class="buttons"  id="button-visually-impaired">Visually impaired</button>
            <input type="range" min="0" max="50" value="2" class="intensity-slider" id="intensity-range">
            <button class="buttons" id="button-glaucoma">Glaucoma</button>
        </section>
        <section>
            <p> Neurological impairment</p>

            <button class="buttons">dyslexic</button>
            <button class="buttons">ADHD</button>
            <button class="buttons" id="button-tremor">Tremor</button>
        </section>
    </div>
</main>
<script src="dist/listeners.js"></script>
    </main>
    <script src="dist/EventListeners.js"></script>
</body>
</html>
