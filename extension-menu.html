<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>a11y simulator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="extension-menu">
        <h1 class="title"> A11y Simulator</h1>
        <section>
        <div class="buttons">
            <button id="orange-colour">
                Orange Colour
            </button>
            <button id="black-overlay">
                Black Overlay
            </button>
        </section>
        <section>
            <p> Visual impairment</p>

            <button class="disability-button"  id="button-visually-impaired">Visually impaired</button>
            <input type="range" min="0" max="50" value="2" class="intensity-slider" id="intensity-range">
            <button class="disability-button" id="button-glaucoma">Glaucoma</button>
        </section>
        <section>
            <p> Neurological impairment</p>

            <button class="disability-button">dyslexic</button>
            <button class="disability-button">ADHD</button>
        </section>
        </div>
    </main>
    <script src="dist/EventListeners.js"></script>
</body>
</html>
