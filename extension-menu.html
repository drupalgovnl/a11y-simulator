<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>a11y simulator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="extension-menu">

        <section class="header">
            <img class="logo" src="./img/A11Y-sim-icon-64.png"
                alt="icon of a monitor that displays a heart with a checkmark inside it" 
                height="48px" width="48px"/>

            <h1 class="title"> Accessibility Simulator</h1>
        </section>

        <section class="about">
            <p>
            Experience the web with different impairments - and see why the <a href="https://www.w3.org/TR/WCAG22/" target="_blank">WCAG</a> are essential for digital accesibility.</br>
            </p>
        </section>

        <section class="menu">
            <section class="visual">
                <h3> Visual impairment</h3>
                <div class="button-list">
                    <button class="buttons" id="button-visually-impaired">Visually impaired</button>
                    <button class="buttons" id="button-glaucoma">Glaucoma</button>
                    <button class="buttons" id="button-cataract">Cataract</button>
                </div>
            </section>

            <section class="cognitive">
                <h3 class="neuro-title"> Neurological impairment</h3>

                <div class="dyslexia sub-section">
                    <h4 class="sub-section-title">Dyslexia</h4>

                    <div id="dyslexia-menu" class="dyslexia-menu">
                        <div class="check-option">
                            <input type="checkbox" id="mirroring" name="mirroring" />
                            <label for="mirroring">Mirroring</label>
                        </div>
                        <div class="check-option">
                            <input type="checkbox" id="spaces" name="spaces" />
                            <label for="spaces">Spaces</label>
                        </div>
                        <div class="check-option">
                            <input type="checkbox" id="switching" name="switching" />
                            <label for="switching">Switching</label>
                        </div>

                        <div class="check-option">
                            <input type="checkbox" id="word-order" name="word-order" />
                            <label for="word-order">Word Order</label>
                        </div>
                    </div>
                </div>
            </section>

            <section class="motor">
                <h3>Motor impairment</h3>
                <button id="button-tremor">Tremor</button>
            </section>

            <section class="settings">
                <h3>Intensity</h3>
                <input type="range" min="0" max="50" value="0" class="intensity-slider" id="intensity-range">
            </section>
        </section>

                <section class="reset end">
            <button id="resetSim">Reset all filters</button>
        </section>

    </main>
    <script src="dist/EventListeners.js"></script>
</body>

</html>
